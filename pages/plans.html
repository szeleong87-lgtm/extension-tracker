<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Plans — Extension Tracker</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <nav class="crumbs"><a href="../index.html">&larr; Home</a></nav>
  <main>
    <h1>Plans</h1>
    <p class="subtitle">Architectural drawings and plans</p>

    <!--
      Each drawing is a PNG rendered from a single-page PDF, so it shows
      directly as an image — no PDF viewer widget. Each one links to the
      original PDF (opens in a new tab) for a lossless/zoomable copy.

      To add another drawing:
        1. Get it down to a single-page PDF (if it isn't already) — e.g.
           `qpdf --empty --pages source.pdf N -- drawings/name.pdf`.
        2. Rasterize it to a PNG:
           `pdftoppm -png -scale-to-x 2000 -scale-to-y -1 drawings/name.pdf drawings/name`
           (this names the output drawings/name-1.png — rename it to
           drawings/name.png.)
        3. Copy one of the <section class="plan-drawing"> blocks below and
           point its <img src>/<a href> at the new files.
    -->
    <section class="plan-drawing">
      <h2>Current</h2>
      <a class="plan-embed" href="../drawings/current.pdf" target="_blank" rel="noopener">
        <img src="../drawings/current.png" alt="Current ground floor plan" />
      </a>
    </section>

    <section class="plan-drawing">
      <h2>Proposed</h2>
      <a class="plan-embed" href="../drawings/proposed.pdf" target="_blank" rel="noopener">
        <img src="../drawings/proposed.png" alt="Proposed ground floor plan" />
      </a>
    </section>
  </main>
</body>
</html>
