<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Glazing — Extension Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="crumbs"><a href="index.html">&larr; Home</a></nav>
  <main>
    <h1>Glazing</h1>
    <div id="category"></div>
  </main>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    loadExtensionData().then((data) => {
      const category = data.categories.find((c) => c.id === "glazing");
      renderCategory(category, document.getElementById("category"));
    });
  </script>
</body>
</html>
